<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d1d20" />
    <meta name="description" content="Find volunteer roles with organizations across Saskatchewan. Browse the organization directory, read guides and templates, and get in touch with local organizations." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VolunteerConnect Saskatchewan" />
    <meta property="og:title" content="VolunteerConnect Saskatchewan" />
    <meta property="og:description" content="Find volunteer roles with organizations across Saskatchewan." />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Noticia+Text:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved accessibility preferences before the first paint so the
      // page never flashes in the wrong theme. Mirrors src/accessibility/a11yStorage.js.
      (function () {
        var contrast = 'light', fontSize = 'normal';
        try {
          var saved = JSON.parse(window.localStorage.getItem('a11y-settings') || '{}');
          if (['light', 'dark', 'high'].indexOf(saved.contrast) !== -1) contrast = saved.contrast;
          if (['normal', 'large', 'xlarge'].indexOf(saved.fontSize) !== -1) fontSize = saved.fontSize;
        } catch (e) {}
        document.documentElement.setAttribute('data-contrast', contrast);
        document.documentElement.setAttribute('data-font-size', fontSize);
        var language = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
        try {
          var savedLanguage = window.localStorage.getItem('language');
          if (savedLanguage === 'en' || savedLanguage === 'fr') language = savedLanguage;
        } catch (e) {}
        document.documentElement.setAttribute('lang', language === 'fr' ? 'fr-CA' : 'en-CA');
      })();
    </script>
    <title>VolunteerConnect Saskatchewan</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
